name: Native Android (from source)

# F-Droid / Wallet Scrutiny path: rebuild libmonerowalletcore.so via Gradle
# and assemble an unsigned release APK. This is also the default local/Play
# path; the legacy source env flag is retained for recipe compatibility.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MoneroWalletCoreFFI"
      - "MoneroWalletCoreFFI/**"
      - "walletcore/build.gradle.kts"
      - ".github/workflows/native-android.yml"
      - "docs/REPRODUCIBLE_BUILD.md"
  pull_request:
    paths:
      - "MoneroWalletCoreFFI"
      - "MoneroWalletCoreFFI/**"
      - "walletcore/build.gradle.kts"
      - ".github/workflows/native-android.yml"

env:
  ANDROID_API: "26"
  CARGO_FEATURES: "compile-time-generators"
  CARGO_TERM_COLOR: always
  NEXAWAL_BUILD_NATIVE_FROM_SOURCE: "1"

jobs:
  build-from-source:
    name: From-source native + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Record source pins
        id: pins
        run: |
          echo "app_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ffi_commit=$(git -C MoneroWalletCoreFFI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app=$(git rev-parse HEAD)"
          echo "ffi=$(git -C MoneroWalletCoreFFI rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble release (rebuild .so from source)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_API: ${{ env.ANDROID_API }}
          CARGO_FEATURES: ${{ env.CARGO_FEATURES }}
          ABIS: arm64-v8a,x86_64
          NEXAWAL_BUILD_NATIVE_FROM_SOURCE: "1"
        run: |
          chmod +x MoneroWalletCoreFFI/Scripts/build_android.sh
          ./gradlew :app:assembleRelease --no-daemon

      - name: Write SHA256SUMS (Scrutiny / release notes)
        run: |
          OUT=MoneroWalletCoreFFI/.build/artifacts/android
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          {
            echo "# nexawal-android native rebuild (source-first)"
            echo "# app_commit=${{ steps.pins.outputs.app_commit }}"
            echo "# ffi_commit=${{ steps.pins.outputs.ffi_commit }}"
            echo "# ndk_path=${NDK_PATH}"
            echo "# ndk_setup=r27b"
            echo "# android_api=${{ env.ANDROID_API }}"
            echo "# cargo_features=${{ env.CARGO_FEATURES }}"
            echo "# profile=release"
            echo "# abis=arm64-v8a,x86_64"
            echo "#"
            (cd "$OUT" && find . -name 'libmonerowalletcore.so' -print0 | sort -z | xargs -0 sha256sum)
          } | tee native-android-SHA256SUMS.txt

      - name: Upload APK + .so + checksums
        uses: actions/upload-artifact@v7
        with:
          name: from-source-android-${{ steps.pins.outputs.app_commit }}
          path: |
            app/build/outputs/apk/release/*.apk
            MoneroWalletCoreFFI/.build/artifacts/android/**/libmonerowalletcore.so
            native-android-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
